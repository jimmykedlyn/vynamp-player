[package]
name = "vynamp_player"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Player Vynamp: shell de playback, integracao do engine, UI."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "accesskit", "x11", "wayland"] }
egui = { version = "0.37.0", default-features = false }

[[bin]]
name = "vynamp_player"
path = "src/main.rs"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
